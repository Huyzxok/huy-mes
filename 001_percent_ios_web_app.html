            padding: 0;

        .container {

            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            padding: 20px;

            border-radius: 0 0 15px 15px;

        h2 {
            color: #2c3e50;
            padding-bottom: 10px;
            border-left: 5px solid #0984e3;
            padding-left: 10px;
            margin-top: 30px;
        }
        .day-section {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 5px 12px rgba(0,0,0,0.08);
            transition: transform 0.2s ease-in-out;
        }
        .day-section:hover {
            transform: scale(1.01);
        }
        ul {
            list-style-type: none;
            padding-left: 0;
        }
        li {
            margin: 15px 0;
            background: #f1f2f6;
            padding: 12px 15px;
            border-radius: 8px;
            transition: background 0.3s;
        }
        li:hover {
            background: #dff9fb;
        }
        input[type="checkbox"] {
            display: none;
        }
        label {
            font-size: 16px;
            cursor: pointer;
            display: block;
            padding-left: 30px;
            position: relative;
        }
        label::before {
            content: "";
            position: absolute;
            left: 0;
            top: 2px;
            width: 20px;
            height: 20px;
            border: 2px solid #3498db;
            border-radius: 4px;
            background: white;
        }
        input[type="checkbox"]:checked + label::before {
            background: #3498db;
        }
        .media-box {
            display: none;
            margin-top: 15px;
            animation: fadeIn 0.5s ease-in-out;
        }
        input[type="checkbox"]:checked + label + .media-box {
            display: block;
        }
        iframe {
            width: 100%;
            max-width: 100%;
            height: 300px;
            border-radius: 8px;
            border: none;
        }
        img {
            width: 100%;
            max-width: 100%;
            margin-bottom: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }
        @media screen and (max-width: 600px) {
            iframe {
                height: 200px;
            }
        }
